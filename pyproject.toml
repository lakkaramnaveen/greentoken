[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greentoken"
version = "0.1.0"
description = "Measure and reduce the energy cost of every LLM token in the datacenter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]
apple = ["mlx-lm>=0.19"]
dev = ["pytest>=8"]

[project.scripts]
greentoken = "greentoken.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
